services:
  proxy:
    build: .
    env_file:
      - path: ./.env
        format: raw
    environment:
      MUX_SERVER_PORT: "${MUX_SERVER_PORT:-8380}"
    ports:
      - "${MUX_PUBLISH_HOST:-0.0.0.0}:${MUX_PUBLISH_PORT:-8380}:${MUX_SERVER_PORT:-8380}"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
