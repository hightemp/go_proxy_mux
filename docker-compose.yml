services:
  proxy:
    build: .
    user: "${PROXY_RUN_UID:-1000}:${PROXY_RUN_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.env
        format: raw
    environment:
      MUX_SERVER_PORT: "${MUX_SERVER_PORT:-8380}"
    ports:
      - "${MUX_PUBLISH_HOST:-0.0.0.0}:${MUX_PUBLISH_PORT:-8380}:${MUX_SERVER_PORT:-8380}"
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
