server:
  host: "0.0.0.0"
  port: 8380
  tls:
    cert_file: "./certs/fullchain.pem"
    key_file: "./certs/privkey.pem"
  max_connections: 1024
  max_connections_per_ip: 128
  max_header_bytes: 65536
  http2_max_concurrent_streams: 0 # Derives from the tunnel limits.
  http2_send_ping_timeout: 1m
  http2_ping_timeout: 15s
  http2_write_byte_timeout: 30s
  read_header_timeout: 15s
  idle_timeout: 2m
  shutdown_timeout: 15s

auth:
  enabled: true
  username: "<set-username>"
  password: "<set-strong-password>"

proxy:
  algorithm: roundrobin
  timeout: 30 # Seconds until HTTP response headers or CONNECT setup.
  network: auto # auto, tcp4, or tcp6
  dial_timeout: 10s
  dial_keep_alive: 30s
  tls_handshake_timeout: 10s
  response_header_timeout: 30s
  response_body_idle_timeout: 2m
  idle_conn_timeout: 90s
  expect_continue_timeout: 1s
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  max_conns_per_host: 0 # No per-host total limit.
  max_tunnels: 256
  max_tunnels_per_ip: 128
  tunnel_idle_timeout: 2m
  failover_cooldown: 30s

upstreams:
  - url: "http://proxy1.example.com:8080"
    auth:
      enabled: false
  - url: "https://proxy2.example.com:8443"
    auth:
      enabled: true
      username: "<upstream-username>"
      password: "<upstream-password>"
    # tls_ca_file: "./certs/upstream-ca.pem" # Only for a private CA.
  - url: "socks4://proxy3.example.com:1080"
    auth:
      enabled: true
      username: "<upstream-username>" # SOCKS4 USERID; no password field.
  - url: "socks5://proxy4.example.com:1080"
    auth:
      enabled: true
      username: "<upstream-username>"
      password: "<upstream-password>"
